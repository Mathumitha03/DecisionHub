spring.application.name=backend

# ==============================
# Database
# ==============================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/decisionhub}
spring.datasource.username=postgres
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==============================
# Server
# ==============================

server.port=${PORT:8080}

# ==============================
# JWT
# ==============================

jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLXNwcmluZy1ib290}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==============================
# Admin Seeder
# ==============================

app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ==============================
# Frontend
# ==============================

app.frontend.url=${FRONTEND_URL:http://localhost:5173}